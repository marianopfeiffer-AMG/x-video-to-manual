name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 3.9 = el python3 del sistema en macOS; 3.12 = el del VPS (Ubuntu 24.04).
        python: ['3.9', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Instalar dependencias de test
        run: pip install -r requirements-dev.txt

      - name: pytest
        run: pytest -q

      - name: shellcheck (solo Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh

      - name: bash -n (sintaxis, macOS bash 3.2)
        if: matrix.os == 'macos-latest'
        run: for f in scripts/*.sh; do bash -n "$f"; done

      - name: --help no debe imprimir código
        run: |
          ./scripts/x-video-to-manual.sh --help | tee /tmp/help.txt
          ! grep -q 'set -euo' /tmp/help.txt
